name: Build Windows VST3

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the build artifact (e.g. 1.5.0)"
        required: false
        default: "dev"

env:
  JUCE_VERSION: "8.0.11"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout EarFix
        uses: actions/checkout@v4

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download JUCE ${{ env.JUCE_VERSION }} (Windows, prebuilt Projucer)
        shell: pwsh
        run: |
          $url = "https://github.com/juce-framework/JUCE/releases/download/${{ env.JUCE_VERSION }}/juce-${{ env.JUCE_VERSION }}-windows.zip"
          Invoke-WebRequest -Uri $url -OutFile juce.zip
          # Projucer resolves each exporter's MODULEPATH relative to the .jucer file's
          # own directory (repo root), not relative to the exporter's targetFolder. The
          # VS2022 exporter uses "../../JUCE/modules" (matching the Mac exporter's
          # convention), so JUCE must land two levels above the checked-out repo root.
          Expand-Archive -Path juce.zip -DestinationPath "..\..\" -Force
          Remove-Item juce.zip
          Get-ChildItem "..\..\JUCE\Projucer.exe"

      - name: Resave project (regenerate the Visual Studio solution)
        shell: pwsh
        run: |
          & "..\..\JUCE\Projucer.exe" --resave "HearingCorrectionAUv2.jucer"
          # Projucer's CLI can return before it has finished flushing the per-exporter
          # files it just logged as saved, so poll briefly rather than checking once.
          $slnPath = "Builds\VisualStudio2022\EarFix.sln"
          for ($i = 0; $i -lt 15 -and -not (Test-Path $slnPath); $i++) {
            Start-Sleep -Seconds 1
          }
          if (-not (Test-Path $slnPath)) {
            Write-Error "Resave did not produce a solution file -- check the module path error above."
            exit 1
          }

      - name: Remove AAX project from solution (no AAX SDK configured)
        shell: pwsh
        run: |
          # pluginFormats is a single project-wide setting (also covers the macOS
          # exporter, which does need buildAAX), so Projucer generates an AAX project
          # for Windows too even without an SDK path configured. Strip it out (GUID
          # extracted dynamically since Projucer's generated GUIDs aren't stable
          # across resaves) so a plain solution build doesn't fail on it. VST3 has no
          # dependency on AAX, so removing it doesn't affect the VST3 build.
          $slnPath = "Builds\VisualStudio2022\EarFix.sln"
          $content = Get-Content $slnPath -Raw
          $pattern = '(?ms)^Project\("\{[0-9A-Fa-f-]+\}"\) = "EarFix - AAX", "EarFix_AAX\.vcxproj", "(\{[0-9A-Fa-f-]+\})"\r?\n.*?^EndProject\r?\n'
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            $aaxGuid = $match.Groups[1].Value
            $content = $content.Remove($match.Index, $match.Length)
            $content = $content -replace "(?m)^\s*$([regex]::Escape($aaxGuid))\..*\r?\n", ''
            Set-Content $slnPath -Value $content -NoNewline
            Write-Host "Removed AAX project ($aaxGuid) from the solution"
          } else {
            Write-Host "No AAX project found in the solution -- nothing to remove"
          }

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build VST3 (Release|x64)
        shell: pwsh
        run: |
          msbuild "Builds\VisualStudio2022\EarFix.sln" /p:Configuration=Release /p:Platform=x64 /m

      - name: Locate and package the build
        id: package
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path "Builds\VisualStudio2022" -Filter "*.vst3" -Recurse -Directory | Select-Object -First 1
          if (-not $vst3) {
            Write-Error "No .vst3 output found under Builds\VisualStudio2022"
            exit 1
          }
          Write-Host "Found VST3 at: $($vst3.FullName)"
          $zipName = "EarFix-v${{ steps.version.outputs.value }}-Windows.zip"
          Compress-Archive -Path $vst3.FullName -DestinationPath $zipName
          echo "zip=$zipName" >> $env:GITHUB_OUTPUT

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: EarFix-Windows-VST3
          path: ${{ steps.package.outputs.zip }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "${{ github.ref_name }}" "${{ steps.package.outputs.zip }}" --clobber
